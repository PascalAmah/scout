<title>Scout wordmark logo, Fraunces typeface</title>
<desc>The word Scout set in Fraunces, an elegant editorial serif with soft old-style contrast and ball terminals, outlined to paths, charcoal colored, with the letter O replaced by a minimalist monocular symbol in emerald green with a dark lens and a small white reflection.</desc>
