[project]
name = "scout-api"
version = "0.1.0"
description = "Scout API — AI-native startup job search workspace"
readme = "README.md"
authors = [
    { name = "PascalAmah", email = "pascal.amah10@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "pyjwt>=2.8.0",
    "argon2-cffi>=23.1.0",
    "redis>=5.0.0",
    "email-validator>=2.1.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
    "pgvector>=0.3.0",
    "reportlab>=4.2.0",
    "openai>=1.40.0",
    # Runtime broker client — the API enqueues enrich/generation tasks straight
    # from request handlers (job_queue.send_task). It must be a runtime dep, not
    # dev-only: the API Dockerfile builds with `uv sync --no-dev`, and without
    # celery in the production image the worker never receives anything.
    "celery>=5.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-reportlab>=4.2.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

exclude = [
    "alembic/versions",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
